<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ورود مشتری — HAYK Loyalty Club</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <main class="page">
    <a href="index.html" class="link-back">→ بازگشت</a>
    <div class="card">
      <div class="brand-top">
        <div class="gold-rule"></div>
        <div class="brand-eyebrow">HAYK</div>
      </div>
      <h1 class="page-title" style="font-size:32px;">ورود مشتری</h1>
      <p class="page-sub">شماره موبایل و کد ۴ رقمیتون رو وارد کنید تا امتیازهاتون رو ببینید.</p>

      <div id="msg" class="form-msg"></div>

      <form id="login-form">
        <div class="field">
          <label>شماره موبایل</label>
          <input type="tel" id="f-phone" placeholder="09xxxxxxxxx" required autofocus />
        </div>
        <div class="field">
          <label>کد ۴ رقمی</label>
          <input type="tel" id="f-pin" placeholder="مثلاً 1234" maxlength="4" inputmode="numeric" required />
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">ورود به حساب من</button>
      </form>

      <p class="center small muted mt-24">
        هنوز عضو نشدید؟ <a href="join.html" style="color:var(--gold); font-weight:700;">همین الان عضو شوید</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideFormMsg(msg);
      const phone = normalizePhone(document.getElementById("f-phone").value);
      const pin = document.getElementById("f-pin").value.trim();
      if (!phone) return;

      if (!/^\d{4}$/.test(pin)) {
        showFormMsg(msg, "کد باید دقیقاً ۴ رقم باشه (فقط عدد).");
        return;
      }

      setBtnLoading(submitBtn, true, "در حال جستجو…");
      try {
        const customer = await fetchCustomerByPhone(phone);
        if (!customer) {
          showFormMsg(msg, "شماره‌ای با این مشخصات پیدا نشد. اول عضو بشید.");
          setBtnLoading(submitBtn, false);
          return;
        }

        if (!customer.pin) {
          // Legacy customer from before the PIN feature existed —
          // whatever they enter now becomes their PIN going forward.
          const { error } = await supabaseClient
            .from("customers")
            .update({ pin })
            .eq("id", customer.id);
          if (error) throw error;
          window.location.href = `dashboard.html?id=${customer.id}`;
          return;
        }

        if (customer.pin !== pin) {
          showFormMsg(msg, "کد وارد شده اشتباهه.");
          setBtnLoading(submitBtn, false);
          return;
        }

        window.location.href = `dashboard.html?id=${customer.id}`;
      } catch (err) {
        console.error(err);
        showFormMsg(msg, "مشکلی پیش اومد، دوباره تلاش کنید.");
        setBtnLoading(submitBtn, false);
      }
    });
  </script>
</body>
</html>
