<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HAYK — باشگاه وفاداری</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
  html, body{ background: #000 !important; }
  .bg-slideshow{ position:fixed; inset:0; z-index:0; overflow:hidden; background:#000; }
  .bg-slide{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    opacity:0; transition: opacity 1.8s ease;
  }
  .bg-slide.active{ opacity:1; }
  .bg-overlay{
    position:fixed; inset:0; z-index:1;
    background: rgba(10,6,3,0.5);
  }
  main.page{ position:relative; z-index:2; }
</style>
</head>
<body>

  <div class="bg-slideshow" id="bg-slideshow"></div>
  <div class="bg-overlay"></div>

  <main class="page">
    <div class="card">
      <div class="brand-top">
        <div class="gold-rule"></div>
        <div class="brand-eyebrow" style="letter-spacing:2px; max-width:280px; line-height:1.6;">HAYK BAMLAND/SADEQIE</div>
      </div>

      <h1 class="page-title">باشگاه وفاداری</h1>
      <p class="page-sub">با هر قهوه امتیاز جمع کنید، به جوایز ویژه دست پیدا کنید و از یک تجربه‌ی لوکس قهوه لذت ببرید.</p>

      <a href="join.html" class="btn btn-primary">☕ عضویت در باشگاه</a>
      <a href="login.html" class="btn btn-outline">👤 ورود مشتری</a>
      <a href="menu.html" class="btn btn-outline">📖 منوی کافه</a>
      <a href="staff-admin.html" class="btn btn-dark">🧑‍💼 کارکنان / مدیریت</a>

      <div class="footer-divider"></div>

      <div class="footer-icons">
        <div class="item">
          <div class="icon">🍵</div>
          <div class="label">کسب امتیاز</div>
        </div>
        <div class="item">
          <div class="icon">🎁</div>
          <div class="label">نوشیدنی رایگان</div>
        </div>
        <div class="item">
          <div class="icon">⭐</div>
          <div class="label">جوایز ویژه</div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function loadBackgroundSlideshow() {
      try {
        const { data, error } = await supabaseClient
          .from("bg_images")
          .select("*")
          .order("sort_order", { ascending: true });
        if (error || !data || data.length === 0) return;

        const container = document.getElementById("bg-slideshow");
        data.forEach((img, i) => {
          const slide = document.createElement("div");
          slide.className = "bg-slide" + (i === 0 ? " active" : "");
          slide.style.backgroundImage = `url("${img.image_url}")`;
          container.appendChild(slide);
        });

        if (data.length > 1) {
          let current = 0;
          const slides = container.querySelectorAll(".bg-slide");
          setInterval(() => {
            slides[current].classList.remove("active");
            current = (current + 1) % slides.length;
            slides[current].classList.add("active");
          }, 6000);
        }
      } catch (err) {
        console.error(err);
      }
    }
    loadBackgroundSlideshow();
  </script>
</body>
</html>
