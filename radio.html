<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>رادیو HAYK</title>
<meta name="theme-color" content="#1d110a" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/cinema.css" />
<style>
  .radio{min-height:100svh;display:flex;flex-direction:column;position:relative;overflow:hidden;padding:24px 22px calc(28px + env(safe-area-inset-bottom));}
  .radio .giant{top:40px;color:rgba(242,231,214,.06);}
  .r-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
  .r-live{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--crema);}
  .r-live i{width:8px;height:8px;border-radius:50%;background:var(--terra-hi);box-shadow:0 0 0 0 rgba(201,105,63,.6);}
  .playing .r-live i{animation:ping 1.6s infinite;}
  @keyframes ping{70%{box-shadow:0 0 0 10px rgba(201,105,63,0);}100%{box-shadow:0 0 0 0 rgba(201,105,63,0);}}

  .r-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;position:relative;z-index:1;text-align:center;}
  .disc{width:min(68vw,290px);aspect-ratio:1;border-radius:50%;position:relative;
    background:repeating-radial-gradient(circle at 50% 50%,#150c06 0 3px,#22140b 3px 5px);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7),inset 0 0 0 6px #2b1a0f;
    animation:spin 9s linear infinite;animation-play-state:paused;}
  .playing .disc{animation-play-state:running;}
  .disc::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 20deg,transparent 0 20%,rgba(255,255,255,.09) 25%,transparent 30% 70%,rgba(255,255,255,.07) 75%,transparent 80%);}
  .disc .lab{position:absolute;inset:32%;border-radius:50%;background:var(--terra);display:grid;place-items:center;
    font-weight:900;font-size:clamp(14px,4.5vw,20px);letter-spacing:.2em;color:var(--cream);font-family:'Inter',sans-serif;}
  .disc .lab::after{content:"";position:absolute;width:9%;aspect-ratio:1;border-radius:50%;background:var(--espresso);}
  .disc .lab span{position:absolute;top:18%;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .eq{display:flex;gap:4px;height:22px;align-items:flex-end;justify-content:center;}
  .eq i{width:4px;height:6px;border-radius:2px;background:var(--crema);}
  .playing .eq i{animation:eq 1s ease-in-out infinite;}
  .eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
  @keyframes eq{0%,100%{height:5px}50%{height:22px}}

  .np-title{font-size:clamp(22px,6.5vw,30px);font-weight:900;line-height:1.5;margin:0;max-width:100%;overflow-wrap:anywhere;}
  .np-artist{font-size:14px;color:var(--latte);margin:4px 0 0;min-height:1.5em;}

  .r-ctl{position:relative;z-index:1;max-width:520px;width:100%;margin:0 auto;}
  .prog{height:5px;border-radius:5px;background:rgba(242,231,214,.15);overflow:hidden;direction:ltr;cursor:pointer;}
  .prog i{display:block;height:100%;width:0;background:var(--crema);}
  .times{display:flex;justify-content:space-between;direction:ltr;font-size:11px;color:var(--latte);margin-top:6px;font-variant-numeric:tabular-nums;}
  .btns{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:14px;direction:ltr;}
  .rb{width:52px;height:52px;border-radius:50%;border:1px solid rgba(242,231,214,.25);background:transparent;color:var(--cream);font-size:18px;cursor:pointer;display:grid;place-items:center;}
  .rb:focus-visible,.big:focus-visible,.start:focus-visible{outline:3px solid var(--crema);outline-offset:3px;}
  .rb:active{transform:scale(.94);}
  .big{width:74px;height:74px;border-radius:50%;border:0;background:var(--terra);color:var(--cream);font-size:26px;cursor:pointer;display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(169,80,47,.7);}
  .vol{display:flex;align-items:center;gap:10px;margin-top:18px;direction:ltr;justify-content:center;font-size:16px;}
  .vol input{width:150px;accent-color:var(--crema);}

  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
  .chip{padding:7px 14px;border-radius:999px;border:1px solid rgba(242,231,214,.25);background:transparent;color:var(--latte);font:inherit;font-size:12px;cursor:pointer;}
  .chip.on{background:var(--cream);color:var(--ink);border-color:var(--cream);font-weight:700;}
  .live-mode .prog,.live-mode .times{visibility:hidden;}
  .start-wrap{position:absolute;inset:0;z-index:5;background:rgba(29,17,10,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;}
  .start{padding:18px 40px;border-radius:999px;border:0;background:var(--terra);color:var(--cream);font:inherit;font-size:18px;font-weight:800;cursor:pointer;}
  .start-wrap p{margin:0;color:var(--latte);font-size:14px;line-height:2;}
  .empty{color:var(--latte);font-size:14px;line-height:2;}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){.disc,.eq i,.r-live i{animation:none !important;}}
</style>
</head>
<body class="cinema">
<div class="radio" id="radio">
  <div class="giant" aria-hidden="true">رادیو</div>

  <div class="r-top">
    <a href="index.html" class="back">← HAYK</a>
    <span class="r-live"><i></i> رادیوی کافه</span>
  </div>

  <div class="r-main">
    <div class="disc" aria-hidden="true"><div class="lab"><span>HAYK</span></div></div>
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div>
      <h1 class="np-title" id="title">در حال آماده‌سازی…</h1>
      <p class="np-artist" id="artist"></p>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="r-ctl">
    <div class="prog" id="prog"><i id="bar"></i></div>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="btns">
      <button class="rb" id="prev" aria-label="قبلی">⏮</button>
      <button class="big" id="play" aria-label="پخش / مکث">▶</button>
      <button class="rb" id="next" aria-label="بعدی">⏭</button>
    </div>
    <div class="vol"><span>🔈</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="صدا" /><span>🔊</span></div>
  </div>

  <div class="start-wrap" id="start">
    <div class="giant" aria-hidden="true" style="position:absolute;top:30%;color:rgba(242,231,214,.05)">HAYK</div>
    <p id="start-msg">برای شروع رادیو لمس کنید</p>
    <button class="start" id="start-btn">▶ شروع رادیو</button>
    <p style="font-size:12px;opacity:.7">مرورگرها بدون یک لمس اجازهٔ پخش صدا نمی‌دن؛ فقط یک بار لازمه.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  const root = $("radio"), audio = new Audio();
  audio.preload = "auto";
  let all = [], stations = [], queue = [], history = [], current = null, started = false, wakeLock = null;
  let channel = "files";          // "files" یا id یک ایستگاه
  let failStreak = 0;

  const faDigits = (s)=>String(s).replace(/\d/g,(d)=>"۰۱۲۳۴۵۶۷۸۹"[d]);
  const fmt = (t)=>{ if(!isFinite(t)) return "0:00"; const m=Math.floor(t/60), s=Math.floor(t%60); return m+":"+String(s).padStart(2,"0"); };
  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  const isLive = ()=> channel !== "files";
  const curStation = ()=> stations.find(x=>x.id===channel);

  async function loadAll(){
    let ok = false;
    const r1 = await supabaseClient.from("radio_tracks").select("*").eq("active", true);
    if (!r1.error && r1.data) { all = r1.data; ok = true; const ids=new Set(all.map(t=>t.id)); queue = queue.filter(t=>ids.has(t.id)); }
    const r2 = await supabaseClient.from("radio_stations").select("*").eq("active", true).order("created_at",{ascending:true});
    if (!r2.error && r2.data) { stations = r2.data; ok = true; }
    renderChips();
    return ok;
  }

  function renderChips(){
    const items = [];
    if (all.length) items.push({id:"files", name:"آهنگ‌های کافه"});
    stations.forEach(s=>items.push({id:s.id, name:s.name}));
    $("chips").innerHTML = items.length > 1 ? items.map(i=>`<button class="chip ${i.id===channel?"on":""}" data-c="${i.id}">${i.name.replace(/</g,"&lt;")}</button>`).join("") : "";
  }
  $("chips").addEventListener("click",(e)=>{
    const b = e.target.closest(".chip"); if(!b) return;
    setChannel(b.dataset.c, true);
  });

  function pickDefaultChannel(){
    let saved = null; try{ saved = localStorage.getItem("hayk_radio_ch"); }catch(e){}
    if (saved === "files" && all.length) return "files";
    if (saved && stations.some(s=>s.id===saved)) return saved;
    if (all.length) return "files";
    if (stations.length) return stations[Math.floor(Math.random()*stations.length)].id;
    return null;
  }

  function setChannel(c, play){
    channel = c; failStreak = 0;
    try{ localStorage.setItem("hayk_radio_ch", c); }catch(e){}
    root.classList.toggle("live-mode", isLive());
    renderChips();
    if (!play) return;
    if (isLive()) playStation(curStation()); else { current = null; nextTrack(); }
  }

  function nextFromQueue(){
    if (!all.length) return null;
    if (!queue.length) {
      queue = shuffle(all);
      if (current && queue.length > 1 && queue[0].id === current.id) queue.push(queue.shift());
    }
    return queue.shift();
  }

  function show(title, artist){
    $("title").textContent = title || "بدون نام";
    $("artist").textContent = artist || "";
    document.title = title + " — رادیو HAYK";
    if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: title, artist: artist || "HAYK", album: "رادیو HAYK" });
  }

  function playTrack(t){ current = t; show(t.title, t.artist); audio.src = t.audio_url; audio.play().catch(()=>{}); }
  function playStation(st){
    if (!st) return;
    show(st.name, "پخش زنده");
    audio.src = st.stream_url; audio.play().catch(()=>{});
  }

  function nextTrack(){
    if (current) history.push(current);
    if (history.length > 30) history.shift();
    const t = nextFromQueue();
    if (t) playTrack(t); else $("title").textContent = "هنوز آهنگی اضافه نشده";
  }
  function stepStation(d){
    if (!stations.length) return;
    const i = stations.findIndex(x=>x.id===channel);
    const n = stations[(i + d + stations.length) % stations.length];
    setChannel(n.id, true);
  }
  function next(){ if (isLive()) stepStation(1); else nextTrack(); }
  function prev(){
    if (isLive()) return stepStation(-1);
    if (audio.currentTime > 4 || !history.length) { audio.currentTime = 0; return; }
    playTrack(history.pop());
  }
  function toggle(){ if (audio.paused) { if (isLive()) { const st=curStation(); if(st){ audio.src = st.stream_url; } } audio.play().catch(()=>{}); } else audio.pause(); }

  async function keepAwake(){
    try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>{wakeLock=null;}); } } catch(e){}
  }

  audio.addEventListener("play", ()=>{ root.classList.add("playing"); $("play").textContent="⏸"; keepAwake(); });
  audio.addEventListener("pause", ()=>{ root.classList.remove("playing"); $("play").textContent="▶"; });
  audio.addEventListener("playing", ()=>{ failStreak = 0; });
  audio.addEventListener("ended", ()=>{ if (!isLive()) nextTrack(); else if (started) setTimeout(()=>playStation(curStation()), 1500); });
  audio.addEventListener("error", ()=>{
    if (!started) return;
    failStreak++;
    const limit = isLive() ? Math.max(stations.length, 1) : Math.max(all.length, 1);
    if (failStreak > limit) { $("artist").textContent = "پخش نشد. اینترنت/VPN رو چک کنید."; return; }
    setTimeout(()=>{ if (isLive() && stations.length > 1) stepStation(1); else if (!isLive()) nextTrack(); }, 800);
  });
  audio.addEventListener("timeupdate", ()=>{
    if (isLive()) return;
    const d = audio.duration || 0;
    $("bar").style.width = d ? (audio.currentTime/d*100)+"%" : "0";
    $("cur").textContent = fmt(audio.currentTime);
    $("dur").textContent = fmt(d);
  });
  document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible" && !audio.paused) keepAwake(); });

  $("play").onclick = toggle; $("next").onclick = next; $("prev").onclick = prev;
  $("prog").addEventListener("click",(e)=>{
    if (isLive()) return;
    const r = e.currentTarget.getBoundingClientRect();
    if (audio.duration) audio.currentTime = ((e.clientX - r.left)/r.width) * audio.duration;
  });

  let v = 0.8; try { v = parseFloat(localStorage.getItem("hayk_radio_vol")); if(!(v>=0&&v<=1)) v=0.8; } catch(e){}
  audio.volume = v; $("vol").value = v;
  $("vol").addEventListener("input",(e)=>{ audio.volume = +e.target.value; try{localStorage.setItem("hayk_radio_vol", e.target.value);}catch(_){} });

  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("play", ()=>audio.play());
    navigator.mediaSession.setActionHandler("pause", ()=>audio.pause());
    navigator.mediaSession.setActionHandler("nexttrack", next);
    navigator.mediaSession.setActionHandler("previoustrack", prev);
  }

  $("start-btn").onclick = async ()=>{
    $("start-btn").disabled = true;
    if (!all.length && !stations.length) await loadAll();
    const c = pickDefaultChannel();
    if (!c) { $("start-msg").textContent = "هنوز آهنگ یا رادیویی اضافه نشده. از پنل مدیریت اضافه کنید."; $("start-btn").disabled = false; return; }
    started = true; $("start").classList.add("hidden");
    setChannel(c, true);
  };

  setInterval(loadAll, 15*60*1000);

  (async ()=>{
    const ok = await loadAll();
    if (!ok) { $("start-msg").textContent = "اتصال به سرور برقرار نشد. اینترنت/VPN رو چک کنید و صفحه رو دوباره باز کنید."; $("title").textContent = "—"; }
    else if (!all.length && !stations.length) { $("start-msg").textContent = "هنوز آهنگ یا رادیویی اضافه نشده."; $("title").textContent = "—"; }
    else {
      $("title").textContent = "آماده پخش";
      $("artist").textContent = [all.length ? faDigits(all.length)+" آهنگ" : "", stations.length ? faDigits(stations.length)+" رادیوی آنلاین" : ""].filter(Boolean).join(" و ");
    }
  })();
})();
</script>
</body>
</html>
