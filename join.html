<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>عضویت — HAYK Loyalty Club</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <main class="page">
    <a href="index.html" class="link-back">→ بازگشت</a>
    <div class="card">
      <div class="brand-top">
        <div class="gold-rule"></div>
        <div class="brand-eyebrow">HAYK</div>
      </div>
      <h1 class="page-title" style="font-size:32px;">عضویت در باشگاه</h1>
      <p class="page-sub">اطلاعاتتون رو وارد کنید تا کارت وفاداری اختصاصی خودتون رو بگیرید.</p>

      <div id="msg" class="form-msg"></div>

      <form id="join-form">
        <div class="field">
          <label>نام و نام خانوادگی</label>
          <input type="text" id="f-name" placeholder="مثلاً آرمان محمدی" required />
        </div>
        <div class="field">
          <label>شماره موبایل</label>
          <input type="tel" id="f-phone" placeholder="09xxxxxxxxx" required />
        </div>
        <div class="field">
          <label>یک کد ۴ رقمی بسازید (برای ورودهای بعدی)</label>
          <input type="tel" id="f-pin" placeholder="مثلاً 1234" maxlength="4" inputmode="numeric" required />
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">ساخت کارت وفاداری</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    const form = document.getElementById("join-form");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submit-btn");
    const referrerId = new URLSearchParams(window.location.search).get("ref");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideFormMsg(msg);

      const name = document.getElementById("f-name").value.trim();
      const phone = normalizePhone(document.getElementById("f-phone").value);
      const pin = document.getElementById("f-pin").value.trim();

      if (!name || !phone) {
        showFormMsg(msg, "لطفاً نام و شماره موبایل رو کامل وارد کنید.");
        return;
      }

      if (!/^\d{4}$/.test(pin)) {
        showFormMsg(msg, "کد باید دقیقاً ۴ رقم باشه (فقط عدد).");
        return;
      }

      setBtnLoading(submitBtn, true, "در حال ثبت‌نام…");

      try {
        const existing = await fetchCustomerByPhone(phone);
        if (existing) {
          showFormMsg(
            msg,
            "این شماره قبلاً ثبت شده. لطفاً از «ورود مشتری» با کد ۴ رقمیتون وارد بشید.",
            "info"
          );
          setBtnLoading(submitBtn, false);
          return;
        }

        const { data, error } = await supabaseClient
          .from("customers")
          .insert({ name, phone, pin, referred_by: referrerId || null })
          .select()
          .single();

        if (error) throw error;

        let successMsg = "خوش اومدید! در حال انتقال به کارت شما…";

        if (referrerId) {
          try {
            const referrer = await fetchCustomerById(referrerId);
            if (referrer) {
              const bonusStr = await getSetting("referral_bonus_amount");
              const bonus = parseInt(bonusStr, 10) || 0;
              if (bonus > 0) {
                await supabaseClient
                  .from("customers")
                  .update({ wallet_balance: (referrer.wallet_balance || 0) + bonus })
                  .eq("id", referrer.id);
                await supabaseClient
                  .from("customers")
                  .update({ wallet_balance: (data.wallet_balance || 0) + bonus })
                  .eq("id", data.id);
                successMsg = `خوش اومدید! چون با دعوت یه دوست عضو شدید، ${formatToman(bonus)} به کیف پولتون اضافه شد 🎁`;
              }
            }
          } catch (refErr) {
            console.error("referral bonus failed", refErr);
            // signup itself still succeeded — don't block the user for this
          }
        }

        showFormMsg(msg, successMsg, "success");
        setTimeout(() => {
          window.location.href = `dashboard.html?id=${data.id}`;
        }, 1400);
      } catch (err) {
        console.error(err);
        showFormMsg(msg, "مشکلی پیش اومد، دوباره تلاش کنید.");
        setBtnLoading(submitBtn, false);
      }
    });
  </script>
</body>
</html>
