<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>عضویت — HAYK Loyalty Club</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <main class="page">
    <a href="index.html" class="link-back">→ بازگشت</a>
    <div class="card">
      <div class="brand-top">
        <div class="gold-rule"></div>
        <div class="brand-eyebrow">HAYK</div>
      </div>
      <h1 class="page-title" style="font-size:32px;">عضویت در باشگاه</h1>
      <p class="page-sub">اطلاعاتتون رو وارد کنید تا کارت وفاداری اختصاصی خودتون رو بگیرید.</p>

      <div id="msg" class="form-msg"></div>

      <form id="join-form">
        <div class="field">
          <label>نام و نام خانوادگی</label>
          <input type="text" id="f-name" placeholder="مثلاً آرمان محمدی" required />
        </div>
        <div class="field">
          <label>شماره موبایل</label>
          <input type="tel" id="f-phone" placeholder="09xxxxxxxxx" required />
        </div>
        <div class="field">
          <label>یک کد ۴ رقمی بسازید (برای ورودهای بعدی)</label>
          <input type="tel" id="f-pin" placeholder="مثلاً 1234" maxlength="4" inputmode="numeric" required />
        </div>
        <div class="field" style="display:flex; justify-content:center;">
          <div id="recaptcha-box"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">ساخت کارت وفاداری</button>
      </form>
    </div>
  </main>

  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.addEventListener("load", () => {
      if (window.grecaptcha && RECAPTCHA_SITE_KEY && !RECAPTCHA_SITE_KEY.startsWith("YOUR-")) {
        grecaptcha.render("recaptcha-box", { sitekey: RECAPTCHA_SITE_KEY });
      }
    });
  </script>
  <script>
    const form = document.getElementById("join-form");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideFormMsg(msg);

      const name = document.getElementById("f-name").value.trim();
      const phone = normalizePhone(document.getElementById("f-phone").value);
      const pin = document.getElementById("f-pin").value.trim();

      if (!name || !phone) {
        showFormMsg(msg, "لطفاً نام و شماره موبایل رو کامل وارد کنید.");
        return;
      }

      if (!/^\d{4}$/.test(pin)) {
        showFormMsg(msg, "کد باید دقیقاً ۴ رقم باشه (فقط عدد).");
        return;
      }

      const recaptchaEnabled = RECAPTCHA_SITE_KEY && !RECAPTCHA_SITE_KEY.startsWith("YOUR-");
      let recaptchaToken = "";
      if (recaptchaEnabled) {
        recaptchaToken = window.grecaptcha ? grecaptcha.getResponse() : "";
        if (!recaptchaToken) {
          showFormMsg(msg, "لطفاً تیک «من ربات نیستم» رو بزنید.");
          return;
        }
      }

      setBtnLoading(submitBtn, true, "در حال ثبت‌نام…");

      try {
        if (recaptchaEnabled) {
          const verifyRes = await fetch("/api/verify-recaptcha", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: recaptchaToken }),
          });
          const verifyData = await verifyRes.json();
          if (!verifyData.success) {
            showFormMsg(msg, "تأیید امنیتی ناموفق بود، دوباره تلاش کنید.");
            setBtnLoading(submitBtn, false);
            if (window.grecaptcha) grecaptcha.reset();
            return;
          }
        }

        const existing = await fetchCustomerByPhone(phone);
        if (existing) {
          showFormMsg(
            msg,
            "این شماره قبلاً ثبت شده. لطفاً از «ورود مشتری» با کد ۴ رقمیتون وارد بشید.",
            "info"
          );
          setBtnLoading(submitBtn, false);
          if (window.grecaptcha) grecaptcha.reset();
          return;
        }

        const { data, error } = await supabaseClient
          .from("customers")
          .insert({ name, phone, pin })
          .select()
          .single();

        if (error) throw error;

        showFormMsg(msg, "خوش اومدید! در حال انتقال به کارت شما…", "success");
        setTimeout(() => {
          window.location.href = `dashboard.html?id=${data.id}`;
        }, 900);
      } catch (err) {
        console.error(err);
        showFormMsg(msg, "مشکلی پیش اومد، دوباره تلاش کنید.");
        setBtnLoading(submitBtn, false);
        if (window.grecaptcha) grecaptcha.reset();
      }
    });
  </script>
</body>
</html>
